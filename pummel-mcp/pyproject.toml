[project]
name = "pummel-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the Pummel load testing engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.10",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.scripts]
pummel-mcp = "pummel_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--cov=pummel_mcp --cov-report=term-missing --cov-fail-under=90"
