version: '3'

vars:
  CONTAINER_CLI:
    sh: command -v podman >/dev/null 2>&1 && echo 'podman' || echo 'docker'
  COMPOSE_CLI:
    sh: command -v podman-compose >/dev/null 2>&1 && echo 'podman-compose' || echo 'docker compose'
  MODE: '{{.MODE | default "local"}}'
  PORT: '{{.PORT | default "8000"}}'
  LOG_LEVEL: '{{.LOG_LEVEL | default "info"}}'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  test:
    desc: Run unit and integration tests (default features)
    cmds:
      - cargo test --all-targets

  test:all:
    desc: Run all tests across all optional features
    cmds:
      - cargo test --all-targets --all-features

  test:coverage:
    desc: Run code coverage analysis using cargo-tarpaulin
    cmds:
      - cargo tarpaulin --ignore-tests --skip-clean

  lint:
    desc: Run clippy linter in pedantic and security mode
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  format:
    desc: Format Rust codebase
    cmds:
      - cargo fmt

  format:check:
    desc: Check Rust codebase formatting
    cmds:
      - cargo fmt --check

  audit:
    desc: Audit dependencies for vulnerabilities and security advisories
    cmds:
      - cargo audit

  build:
    desc: Build pummel release binary
    cmds:
      - cargo build --release

  docs:build:
    desc: Build Sphinx documentation portal
    cmds:
      - uv run --with-requirements docs/requirements.txt sphinx-build -b html docs/sphinx/source docs/sphinx/build/html

  docs:diagrams:
    desc: Programmatically generate architecture and workflow diagrams
    cmds:
      - python3 docs/generate_diagrams.py

  dev:hybrid:
    desc: Run hybrid execution (mock background services and pummel CLI)
    cmds:
      - echo "Starting pummel in hybrid mode on port {{.PORT}} with log level {{.LOG_LEVEL}}..."
      - cargo run -- sample_test.yaml --dry-run

  export:k6:
    desc: Transpile a Pummel scenario to an idiomatic k6 script
    cmds:
      - cargo run -- examples/22-k6-export.yaml --export k6 -e target/k6_export.js
      - echo "Exported k6 script generated at target/k6_export.js"

  export:locust:
    desc: Transpile a Pummel scenario to a Python Locust script
    cmds:
      - cargo run -- examples/23-locust-export.yaml --export locust -e target/locustfile.py
      - echo "Exported Locust script generated at target/locustfile.py"

  export:taurus:
    desc: Canonicalize a scenario to standard Taurus YAML
    cmds:
      - cargo run -- examples/15-shorthand.toml --export taurus -e target/canonical_taurus.yaml
      - echo "Canonical Taurus YAML generated at target/canonical_taurus.yaml"

  export:postman:
    desc: Export a Pummel scenario to a Postman Collection v2.1 JSON file
    cmds:
      - cargo run -- examples/22-k6-export.yaml --export postman -e target/pummel_collection.json
      - echo "Exported Postman Collection generated at target/pummel_collection.json"

  export:goose:
    desc: Export a Pummel scenario to a standalone pure Rust Goose script (main.rs)
    cmds:
      - cargo run -- examples/22-k6-export.yaml --export goose -e target/main.rs
      - echo "Exported standalone Goose script generated at target/main.rs"

  import:postman:
    desc: Ingest a Postman Collection JSON into Pummel YAML configuration
    cmds:
      - cargo run -- import target/pummel_collection.json --from postman -o target/imported_postman.yaml
      - echo "Imported Pummel YAML generated at target/imported_postman.yaml"

  observability:dashboards:
    desc: Validate and verify Grafana dashboard JSON formatting
    cmds:
      - python3 -m json.tool deploy/grafana/dashboards/pummel-performance-dashboard.json > /dev/null
      - python3 -m json.tool deploy/grafana/dashboards/k6-load-test-dashboard.json > /dev/null
      - echo "All Grafana dashboard JSON files validated successfully."
